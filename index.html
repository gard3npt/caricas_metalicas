<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coleção: @caricas_metalicas</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4094039418988922" crossorigin="anonymous"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 110px 20px 20px 20px;
    font-family: Arial, sans-serif;
    background: #121212;
    color: rgba(255, 255, 255, 0.623);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(18,18,18,0.98);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 1000;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 1.8rem;
    font-weight: bold;
    color: #FCAF45;
    text-shadow: 0 0 10px rgba(252, 175, 69, 0.4);
    flex: 1;
}

.topo-botoes {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
}

.topo-info {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
}

#contador {
    color: #b6d7eca9;
    font-weight: bold;
    margin: 0;
    font-size: 13px;
}

#pesquisa {
    width: 130px;
    padding: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    color: white;
}

#pesquisa:focus {
    outline: none;
    border-color: #FCAF45;
}

.btn-topo {
    width: 75px;
    height: 26px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
    font-size: 11px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    transition: transform 0.2s ease;
}

.btn-topo:hover {
    transform: scale(1.05);
}

.btn-sobre {
    background: #2a2a2a;
    border: 1px solid rgba(255,255,255,0.1);
}

.btn-instagram {
    background: linear-gradient(45deg, #833AB4, #C13584, #E1306C, #FD1D1D, #FCAF45);
    gap: 4px;
}

.btn-instagram svg {
    width: 14px;
    height: 14px;
}

main {
    flex: 1;
    width: 100%;
}

.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
}

/* Estilo unificado para os cards (caricas e publicidade) */
.carica, .anuncio-card {
    background: #1e1e1e;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    transition: 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 250px; /* Garante consistência visual */
}

.carica:hover {
    transform: translateY(-3px);
}

.carica img {
    width: 100%;
    max-width: 180px;
    aspect-ratio: 1 / 1;
    height: auto;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #555;
    box-shadow: 0 0 15px rgba(255,255,255,0.15);
    cursor: pointer;
}

.numero {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}

/* Estilos para o bloco do AdSense se adaptar à grelha */
.anuncio-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: pointer;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 15px;
}

footer {
    margin-top: 40px;
    width: 100%;
    height: 50px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    border-top: 1px solid rgba(255,255,255,0.15);
    z-index: 1000;
}

/* Modal Sobre */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 20000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #1e1e1e;
    color: white;
    width: 90%;
    max-width: 450px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 30px rgba(252,175,69,0.3);
    position: relative;
}

.modal-content h2 {
    color: #FCAF45;
    margin-top: 0;
}

.modal-content a {
    color: #FCAF45;
    text-decoration: none;
}

.modal-content a:hover {
    text-decoration: underline;
}

.fechar-modal {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 30px;
    cursor: pointer;
    color: #FCAF45;
}

/* Responsividade Mobile */
@media (max-width: 768px) {
    header {
        padding: 10px;
        flex-wrap: wrap;
        gap: 8px;
    }

    body {
        padding: 110px 5px 20px 5px;
    }

    h1 {
        font-size: 1.4rem;
        width: 100%;
        order: 1;
        margin-bottom: 2px;
    }

    .topo-botoes {
        order: 2;
        flex-direction: row;
        flex: 1;
        gap: 6px;
    }

    .topo-info {
        order: 3;
        flex: 1;
        align-items: flex-end;
    }

    .btn-topo {
        width: 70px;
        height: 25px;
        font-size: 10px;
    }

    #pesquisa {
        width: 100px;
        padding: 4px;
        font-size: 12px;
    }

    #contador {
        font-size: 11px;
    }

    .galeria {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
    }

    .carica, .anuncio-card {
        padding: 6px;
        min-height: 180px;
    }

    .carica img {
        max-width: 100%;
    }

    .numero {
        font-size: 14px;
    }
}
</style>
</head>
<body>

<div id="modalSobre" class="modal">
    <div class="modal-content">
        <span class="fechar-modal">&times;</span>
        <h2>🍺 Caricas_Metalicas</h2>
        <p>Coleção catalogada por número.</p>
        <p>📍 From: Portugal 🇵🇹</p>
        <p><strong>Total:</strong> <span id="totalModal">0</span> caricas</p>
        <p>
            <strong>Instagram:</strong><br>
            <a href="https://www.instagram.com/caricas_metalicas/" target="_blank">@caricas_metalicas</a>
        </p>
        <p>🫶 Aceito ofertas.</p>
        <p>Última atualização: 16.06.2026</p>
    </div>
</div>

<header>
    <div class="topo-botoes">
        <a href="#" id="abrirSobre" class="btn-topo btn-sobre" aria-label="Sobre">Sobre</a>
        <a href="https://www.instagram.com/caricas_metalicas/" target="_blank" class="btn-topo btn-instagram" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5Zm8.88 1.13a1.12 1.12 0 1 1 0 2.24 1.12 1.12 0 0 1 0-2.24ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"/>
            </svg>
            Insta
        </a>
    </div>

    <h1>🍺 Caricas_Metalicas</h1>

    <div class="topo-info">
        <div id="contador">0 caricas catalogadas</div>
        <input type="text" id="pesquisa" placeholder="🔍 Nº da carica">
    </div>
</header>

<main>
    <div class="galeria" id="galeria"></div>
</main>

<div id="lightbox">
    <img id="lightbox-img" alt="Carica Grande">
</div>

<footer>
    © 2026 | @caricas_metalicas
</footer>

<script>
const galeria = document.getElementById("galeria");
const contador = document.getElementById("contador");
const caricas = [];
const TAMANHO_PASTA = 50;

function obterPasta(numero) {
    const n = parseInt(numero);
    const inicio = Math.floor((n - 1) / TAMANHO_PASTA) * TAMANHO_PASTA + 1;
    const fim = inicio + TAMANHO_PASTA - 1;
    return `${String(inicio).padStart(4, "0")}-${String(fim).padStart(4, "0")}`;
}

function atualizarGaleria() {
    caricas.sort((a, b) => Number(a) - Number(b));
    galeria.innerHTML = "";

    // CONFIGURAÇÃO DO ANÚNCIO: Defina em que posição da grelha ele deve aparecer (Ex: 3º lugar)
    const POSICAO_ANUNCIO = 3; 

    caricas.forEach((numero, index) => {
        
        // Inserção do Anúncio dinamicamente no meio da listagem
        if (index === (POSICAO_ANUNCIO - 1)) {
            const adCard = document.createElement("div");
            adCard.className = "anuncio-card";
            adCard.innerHTML = `
                <div class="anuncio-container">
                    <ins class="adsbygoogle"
                         style="display:block; width:100%; height:100%;"
                         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                         data-ad-slot="YYYYYYYYYY"
                         data-ad-format="fluid"
                         data-matched-content-ui-type="image_stacked"
                         data-matched-content-rows-num="1"
                         data-matched-content-columns-num="1"></ins>
                </div>
            `;
            galeria.appendChild(adCard);
            
            // Ativa o anúncio injetado
            try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
        }

        // Inserção normal das Caricas
        const card = document.createElement("div");
        card.className = "carica";
        card.dataset.numero = numero;

        card.innerHTML = `
            <img src="caricas/${obterPasta(numero)}/${numero}.jpg" alt="${numero}">
            <div class="numero">Nº ${numero}</div>
        `;

        card.querySelector("img").addEventListener("click", () => {
            document.getElementById("lightbox-img").src = `caricas/${obterPasta(numero)}/${numero}.jpg`;
            document.getElementById("lightbox").style.display = "flex";
            document.body.style.overflow = "hidden";
        });

        galeria.appendChild(card);
    });

    contador.textContent = `${caricas.length} caricas na coleção:`;
}

document.getElementById("lightbox").addEventListener("click", () => {
    document.getElementById("lightbox").style.display = "none";
    document.body.style.overflow = "";
});

// Sistema de Pesquisa (Ignora o bloco de anúncio para não quebrar a pesquisa)
document.getElementById("pesquisa").addEventListener("input", function() {
    const texto = this.value.trim().toLowerCase();
    
    // Oculta ou mostra o anúncio se houver pesquisa ativa
    const adBlock = document.querySelector(".anuncio-card");
    if (adBlock) adBlock.style.display = texto === "" ? "" : "none";

    document.querySelectorAll(".carica").forEach(card => {
        card.style.display = card.dataset.numero.includes(texto) ? "" : "none";
    });
});

fetch("caricas.json")
    .then(response => response.json())
    .then(lista => {
        caricas.push(...lista);
        atualizarGaleria();
    })
    .catch(error => {
        console.error("Erro ao carregar caricas.json:", error);
    });

const modalSobre = document.getElementById("modalSobre");
const abrirSobre = document.getElementById("abrirSobre");
const fecharModal = document.querySelector(".fechar-modal");

abrirSobre.addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("totalModal").textContent = caricas.length;
    modalSobre.style.display = "flex";
    document.body.style.overflow = "hidden";
});

fecharModal.addEventListener("click", () => {
    modalSobre.style.display = "none";
    document.body.style.overflow = "";
});

modalSobre.addEventListener("click", (e) => {
    if (e.target === modalSobre) {
        modalSobre.style.display = "none";
        document.body.style.overflow = "";
    }
});
</script>

</body>
</html>

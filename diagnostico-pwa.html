<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<title>Diagnóstico da app instalável</title>
<link rel="manifest" href="manifest.webmanifest" id="ligacaoManifesto">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f172a; color: #e2e8f0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: #94a3b8; margin: 0 0 18px; font-size: .95rem; }
  #resumo { padding: 14px 16px; border-radius: 12px; background: #1e293b; margin-bottom: 14px; font-weight: 600; }
  #resumo.ok { background: #064e3b; color: #a7f3d0; }
  #resumo.erro { background: #7f1d1d; color: #fecaca; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; gap: 12px; padding: 11px 13px; border-radius: 10px; background: #1e293b; }
  li .ic { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
  li.ok .ic { background: #10b981; color: #052e16; }
  li.erro .ic { background: #ef4444; color: #fff; }
  li.aviso .ic { background: #f59e0b; color: #1c1917; }
  li.info .ic { background: #475569; color: #fff; }
  li strong { display: block; font-size: .95rem; }
  li small { display: block; color: #94a3b8; word-break: break-word; margin-top: 2px; }
  .botoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  button { font: inherit; font-weight: 700; padding: 11px 16px; border-radius: 999px; border: 0; cursor: pointer; background: #4f46e5; color: #fff; }
  button.sec { background: #334155; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Diagnóstico da app instalável</h1>
  <p class="sub">Abra esta página no telemóvel onde não consegue instalar. No fim, toque em «Copiar resultado» e envie o texto.</p>
  <div id="resumo" role="status" aria-live="polite">A analisar…</div>
  <ul id="lista"></ul>
  <div class="botoes">
    <button type="button" id="btnInstalar" hidden>Instalar a app</button>
    <button type="button" id="btnCopiar" class="sec">Copiar resultado</button>
    <button type="button" id="btnRepetir" class="sec">Repetir análise</button>
  </div>
</main>

<script>
(function () {
  'use strict';
  var lista = document.getElementById('lista');
  var resumo = document.getElementById('resumo');
  var btnInstalar = document.getElementById('btnInstalar');
  var linhas = [];
  var erros = 0, avisos = 0;
  var pedidoInstalar = null;

  // Endereços a testar (podem ser alterados com ?m=caminho/do/manifesto&s=caminho/do/sw.js)
  var params = new URLSearchParams(location.search);
  function mesmoSite(p, omissao) {
    try {
      var u = new URL(p || omissao, location.href);
      return u.origin === location.origin ? u : new URL(omissao, location.href);
    } catch (e) { return new URL(omissao, location.href); }
  }
  var urlManifesto = mesmoSite(params.get('m'), 'manifest.webmanifest');
  var urlSW = mesmoSite(params.get('s'), 'sw.js');
  document.getElementById('ligacaoManifesto').setAttribute('href', urlManifesto.pathname + urlManifesto.search);

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    pedidoInstalar = e;
    btnInstalar.hidden = false;
  });
  btnInstalar.addEventListener('click', function () {
    if (!pedidoInstalar) return;
    pedidoInstalar.prompt();
    pedidoInstalar = null;
    btnInstalar.hidden = true;
  });

  function add(estado, titulo, detalhe) {
    var simbolo = { ok: '✔', erro: '✘', aviso: '!', info: 'i' }[estado];
    if (estado === 'erro') erros++;
    if (estado === 'aviso') avisos++;
    var li = document.createElement('li');
    li.className = estado;
    var ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = simbolo;
    var div = document.createElement('div');
    var st = document.createElement('strong'); st.textContent = titulo;
    div.appendChild(st);
    if (detalhe) { var sm = document.createElement('small'); sm.textContent = detalhe; div.appendChild(sm); }
    li.appendChild(ic); li.appendChild(div);
    lista.appendChild(li);
    linhas.push('[' + simbolo + '] ' + titulo + (detalhe ? ' — ' + detalhe : ''));
  }

  function buscar(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) { return r; });
  }

  function nomeBrowser(ua) {
    if (/SamsungBrowser/.test(ua)) return 'Samsung Internet';
    if (/Edg\//.test(ua)) return 'Edge';
    if (/OPR\//.test(ua)) return 'Opera';
    if (/Firefox\/|FxiOS/.test(ua)) return 'Firefox';
    if (/CriOS/.test(ua)) return 'Chrome (iPhone/iPad)';
    if (/Chrome\//.test(ua)) return 'Chrome';
    if (/Safari\//.test(ua)) return 'Safari';
    return 'desconhecido';
  }

  function ambiente() {
    var ua = navigator.userAgent;
    add('info', 'Browser: ' + nomeBrowser(ua), ua);
    var seguro = location.protocol === 'https:' || location.hostname === 'localhost';
    add(seguro ? 'ok' : 'erro', 'Ligação segura (HTTPS)', location.origin);
    var emApp = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat|TikTok|BytedanceWebview|GSA\/|; wv\)/.test(ua);
    if (emApp) add('erro', 'A página está aberta dentro de outra aplicação', 'Browsers embutidos (Facebook, Instagram, WhatsApp, Gmail…) não permitem instalar. Abra o endereço diretamente no Chrome.');
    var ios = /iPhone|iPad|iPod/.test(ua);
    if (ios) add('aviso', 'iPhone/iPad', 'Não existe botão «Instalar». Toque em Partilhar e depois em «Adicionar ao ecrã principal».');
    if (/Firefox\//.test(ua) && !ios) add('aviso', 'Firefox', 'O Firefox pode não oferecer a instalação completa. Experimente no Chrome.');
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    add(standalone ? 'info' : 'info', standalone ? 'Esta página já está a correr como app instalada' : 'Aberta num separador normal do browser');
  }

  function caminhoSite(u) { return u.pathname + u.search; }

  function manifesto() {
    return buscar(urlManifesto).then(function (r) {
      if (!r.ok) { add('erro', 'Manifesto não encontrado (HTTP ' + r.status + ')', caminhoSite(urlManifesto)); return null; }
      return r.text().then(function (t) {
        var m;
        try { m = JSON.parse(t); } catch (e) { add('erro', 'O manifesto não é um JSON válido', String(e.message)); return null; }
        add('ok', 'Manifesto encontrado e válido', caminhoSite(urlManifesto));
        add((m.name || m.short_name) ? 'ok' : 'erro', 'Nome da app', (m.name || '') + (m.short_name ? ' (curto: ' + m.short_name + ')' : ''));
        var modos = ['standalone', 'fullscreen', 'minimal-ui'];
        add(modos.indexOf(m.display) !== -1 ? 'ok' : 'erro', 'Modo de apresentação', String(m.display));
        var inicio = m.start_url ? new URL(m.start_url, urlManifesto) : null;
        if (!inicio) { add('erro', 'Falta o start_url'); }
        else {
          var ambito = m.scope ? new URL(m.scope, urlManifesto) : new URL('./', inicio);
          var dentro = inicio.origin === ambito.origin && inicio.pathname.indexOf(ambito.pathname) === 0;
          add(dentro ? 'ok' : 'erro', 'Página inicial dentro do âmbito', 'início ' + caminhoSite(inicio) + ' | âmbito ' + ambito.pathname);
          var daPagina = location.pathname.indexOf(ambito.pathname) === 0;
          add(daPagina ? 'ok' : 'aviso', 'Esta página pertence ao âmbito da app', ambito.pathname);
        }
        return m;
      });
    }).catch(function (e) { add('erro', 'Não foi possível obter o manifesto', String(e.message)); return null; });
  }

  function iconesDoManifesto(m) {
    if (!m) return Promise.resolve();
    var icones = Array.isArray(m.icons) ? m.icons : [];
    if (!icones.length) { add('erro', 'O manifesto não tem ícones'); return Promise.resolve(); }
    var tem192 = false, tem512 = false;
    var testes = icones.map(function (ic) {
      var alvo = new URL(ic.src, urlManifesto);
      return buscar(alvo).then(function (r) {
        if (!r.ok) { add('erro', 'Ícone em falta (HTTP ' + r.status + ')', caminhoSite(alvo)); return; }
        return r.blob().then(function (b) {
          return createImageBitmap(b).then(function (img) {
            var lado = Math.min(img.width, img.height);
            if (lado >= 192) tem192 = true;
            if (lado >= 512) tem512 = true;
            var declarado = String(ic.sizes || '').split('x')[0];
            var coincide = !declarado || Number(declarado) === img.width;
            add(coincide ? 'ok' : 'aviso', 'Ícone ' + (ic.purpose || 'any') + ' ' + img.width + '×' + img.height, caminhoSite(alvo) + (coincide ? '' : ' (o manifesto diz ' + ic.sizes + ')'));
          }).catch(function () { add('erro', 'O ficheiro não é uma imagem válida', caminhoSite(alvo)); });
        });
      }).catch(function (e) { add('erro', 'Falha ao obter o ícone', caminhoSite(alvo) + ' — ' + e.message); });
    });
    return Promise.all(testes).then(function () {
      add(tem192 ? 'ok' : 'erro', 'Existe um ícone de pelo menos 192×192');
      add(tem512 ? 'ok' : 'erro', 'Existe um ícone de pelo menos 512×512');
    });
  }

  function paginaPrincipal() {
    var raiz = new URL('./', urlManifesto);
    return buscar(raiz).then(function (r) {
      if (!r.ok) { add('erro', 'Página principal não encontrada (HTTP ' + r.status + ')', caminhoSite(raiz)); return; }
      return r.text().then(function (t) {
        add(/rel=["']manifest["']/.test(t) ? 'ok' : 'erro', 'A página principal liga o manifesto');
        add(/serviceWorker/.test(t) && /register\(/.test(t) ? 'ok' : 'erro', 'A página principal regista o service worker');
        if (/["']icons\//.test(t)) add('erro', 'A página principal publicada ainda é a versão antiga', 'Ainda aponta para a pasta icons/. Substitua o index.html no GitHub pelo novo.');
      });
    }).catch(function (e) { add('erro', 'Falha ao ler a página principal', String(e.message)); });
  }

  function serviceWorker() {
    if (!('serviceWorker' in navigator)) { add('erro', 'Este browser não suporta service workers'); return Promise.resolve(); }
    return buscar(urlSW).then(function (r) {
      if (!r.ok) { add('erro', 'Ficheiro do service worker não encontrado (HTTP ' + r.status + ')', caminhoSite(urlSW)); return null; }
      add('ok', 'Ficheiro do service worker encontrado', caminhoSite(urlSW));
      return r.text();
    }).then(function (texto) {
      return navigator.serviceWorker.getRegistration(urlSW.pathname.replace(/[^/]*$/, '')).then(function (reg) {
        if (reg) {
          var est = reg.active ? 'ativo' : reg.installing ? 'a instalar' : reg.waiting ? 'à espera' : 'desconhecido';
          add(reg.active ? 'ok' : 'erro', 'Service worker registado: ' + est, 'âmbito ' + new URL(reg.scope).pathname);
          return texto;
        }
        // Não estava registado: tenta registar já, para mostrar o erro exato se falhar
        return navigator.serviceWorker.register(urlSW.pathname).then(function (r) {
          return Promise.race([
            navigator.serviceWorker.ready.then(function () { return true; }),
            new Promise(function (res) { setTimeout(function () { res(false); }, 5000); })
          ]).then(function (ativo) {
            if (ativo) add('aviso', 'O service worker não estava registado; esta página registou-o agora', 'âmbito ' + new URL(r.scope).pathname + '. Abra o site principal, recarregue e repita a análise para confirmar que o próprio site o regista.');
            else add('erro', 'O service worker foi registado mas não chegou a ficar ativo', 'A instalação falhou (normalmente por um ficheiro em falta ou um erro no sw.js).');
            return texto;
          });
        }).catch(function (e) {
          add('erro', 'O registo do service worker falhou', e.name + ': ' + e.message);
          return texto;
        });
      });
    }).then(function (texto) {
      if (!texto) return;
      // Ficheiros que o service worker guarda ao instalar: se faltar um só, a instalação falha toda
      var vistos = {}, caminhos = [];
      var re = /['"]((?:\.\/|\/)?[\w\-.\/]*)['"]/g, x;
      while ((x = re.exec(texto))) {
        var c = x[1];
        if (!c || vistos[c]) continue;
        var parece = c === './' || /\.(html|png|svg|ico|jpg|jpeg|webp|json|webmanifest|css|js)$/i.test(c);
        if (!parece || /^https?:/.test(c)) continue;
        vistos[c] = true; caminhos.push(c);
      }
      return Promise.all(caminhos.map(function (c) {
        var alvo = new URL(c, urlSW);
        return buscar(alvo).then(function (r) {
          if (!r.ok) add('erro', 'Ficheiro que o service worker guarda está em falta (HTTP ' + r.status + ')', caminhoSite(alvo));
        }).catch(function () { add('erro', 'Falha ao obter ficheiro do service worker', caminhoSite(alvo)); });
      })).then(function () {
        add('info', 'Ficheiros guardados pelo service worker verificados', caminhos.length + ' endereços');
      });
    }).catch(function (e) { add('erro', 'Erro ao verificar o service worker', String(e.message)); });
  }

  function aguardarOferta() {
    return new Promise(function (resolve) {
      setTimeout(function () {
        if (pedidoInstalar) add('ok', 'O browser considera a app instalável', 'Toque em «Instalar a app» em baixo.');
        else add('aviso', 'O browser ainda não ofereceu a instalação', 'Se tudo acima estiver ✔, pode já estar instalada ou o browser pode demorar; experimente o menu ⋮ → «Instalar app».');
        resolve();
      }, 6000);
    });
  }

  function resumir() {
    resumo.className = erros ? 'erro' : 'ok';
    resumo.textContent = erros
      ? 'Foram encontrados ' + erros + ' problema(s). Veja os pontos com ✘.'
      : 'Não foram encontrados problemas nos ficheiros' + (avisos ? ' (há ' + avisos + ' aviso(s))' : '') + '.';
  }

  function analisar() {
    lista.textContent = ''; linhas = []; erros = 0; avisos = 0;
    resumo.className = ''; resumo.textContent = 'A analisar…';
    ambiente();
    return manifesto()
      .then(iconesDoManifesto)
      .then(paginaPrincipal)
      .then(serviceWorker)
      .then(aguardarOferta)
      .then(resumir)
      .catch(function (e) { add('erro', 'Erro inesperado', String(e && e.message)); resumir(); });
  }

  document.getElementById('btnRepetir').addEventListener('click', analisar);
  document.getElementById('btnCopiar').addEventListener('click', function () {
    var texto = 'Diagnóstico — ' + location.href + '\n' + resumo.textContent + '\n' + linhas.join('\n');
    var botao = this;
    function feito() { botao.textContent = 'Copiado!'; setTimeout(function () { botao.textContent = 'Copiar resultado'; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(feito, fallback);
    else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); feito(); } catch (e) { /* sem suporte */ }
      document.body.removeChild(ta);
    }
  });

  analisar();
})();
</script>
</body>
</html>
